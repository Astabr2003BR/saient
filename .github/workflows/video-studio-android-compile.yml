name: Video Studio Android Compile

on:
  push:
    branches:
      - feat/ptbr-video-studio
    paths:
      - 'modules/saient-video-studio/**'
      - 'plugins/withTextToSpeechQueries.js'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/video-studio-android-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Compile release Kotlin
        working-directory: android
        env:
          SAIENT_ALLOW_DEBUG_RELEASE: 'true'
        run: ./gradlew :app:compileReleaseKotlin --stacktrace --no-daemon
