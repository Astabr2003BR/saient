name: Video Studio Module Compile

on:
  push:
    branches:
      - feat/ptbr-video-studio
    paths:
      - 'modules/saient-video-studio/**'
      - 'plugins/withTextToSpeechQueries.js'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/video-studio-module-compile.yml'
  workflow_dispatch:

jobs:
  compile-module:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Locate and compile video studio module
        working-directory: android
        env:
          SAIENT_ALLOW_DEBUG_RELEASE: 'true'
        run: |
          set -Eeuo pipefail
          PROJECT=$(./gradlew projects -q | sed -n "s/.*Project '\(:[^']*saient-video-studio[^']*\)'.*/\1/p" | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Could not locate the autolinked saient-video-studio Gradle project." >&2
            ./gradlew projects
            exit 2
          fi
          echo "Compiling $PROJECT"
          ./gradlew "${PROJECT}:compileReleaseKotlin" --stacktrace --no-daemon
