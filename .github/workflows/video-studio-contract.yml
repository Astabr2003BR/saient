name: Video Studio Contract

on:
  push:
    branches:
      - feat/ptbr-video-studio
    paths:
      - 'lib/video-studio/**'
      - 'scripts/test-video-studio.mjs'
      - 'package.json'
      - '.github/workflows/video-studio-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test PT-BR video studio contracts
        run: npm run test:video-studio
