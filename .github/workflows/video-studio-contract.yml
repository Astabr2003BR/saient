name: Video Studio Contract

on:
  push:
    branches:
      - feat/ptbr-video-studio
    paths:
      - 'app/(tabs)/**'
      - 'app/notices.tsx'
      - 'components/Artifact.tsx'
      - 'components/ChatHistoryModal.tsx'
      - 'components/HtmlPreview.tsx'
      - 'components/SetupWizard.tsx'
      - 'engine/wan/**'
      - 'lib/quartz.ts'
      - 'lib/video-studio/**'
      - 'lib/wan-fast/**'
      - 'modules/saient-video-studio/**'
      - 'modules/saient-diffusion/**'
      - 'plugins/quartz/**'
      - 'plugins/withTextToSpeechQueries.js'
      - 'scripts/build-wan-android.sh'
      - 'scripts/apply-ptbr-localization.mjs'
      - 'scripts/apply-chat-ptbr-runtime.mjs'
      - 'scripts/apply-wan-performance.mjs'
      - 'scripts/apply-wan-startup-diagnostics.mjs'
      - 'scripts/apply-wan-fast-native.mjs'
      - 'scripts/test-chat-ptbr-contract.mjs'
      - 'scripts/test-wan-contract.mjs'
      - 'scripts/test-wan-fast-build-contract.mjs'
      - 'scripts/test-wan-fast-native-contract.mjs'
      - 'scripts/test-wan-fast-generation-contract.mjs'
      - 'scripts/test-wan-fast-policy.mjs'
      - 'scripts/test-wan-performance-contract.mjs'
      - 'scripts/test-wan-startup-diagnostics.mjs'
      - 'scripts/test-wan-startup-apply-idempotence.mjs'
      - 'scripts/test-video-studio.mjs'
      - 'scripts/test-video-studio-native-contract.mjs'
      - 'scripts/test-video-studio-export-contract.mjs'
      - 'scripts/test-video-studio-storage-contract.mjs'
      - 'scripts/test-video-studio-pipeline.mjs'
      - 'scripts/test-video-studio-cancel.mjs'
      - 'scripts/test-video-studio-ui-contract.mjs'
      - 'scripts/test-ptbr-ui-contract.mjs'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/video-studio-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test Wan startup diagnostics apply idempotence
        run: node scripts/test-wan-startup-apply-idempotence.mjs

      - name: Apply deterministic PT-BR localization
        run: |
          node scripts/apply-ptbr-localization.mjs
          node scripts/apply-chat-ptbr-runtime.mjs

      - name: Apply deterministic Wan performance profile
        run: node scripts/apply-wan-performance.mjs

      - name: Apply Wan startup diagnostics
        run: node scripts/apply-wan-startup-diagnostics.mjs

      - name: Apply Wan Fast native lifecycle bridge
        run: node scripts/apply-wan-fast-native.mjs

      - name: Install dependencies
        run: npm install

      - name: Test Wan Fast policy contract
        run: npm run test:wan-fast-policy

      - name: Test Wan Fast build/package contract
        run: npm run test:wan-fast-build

      - name: Test Wan Fast native lifecycle contract
        run: npm run test:wan-fast-native

      - name: Test Wan Fast generation contract
        run: npm run test:wan-fast-generation

      - name: Test existing Wan generation contract
        run: npm run test:wan

      - name: Test Wan performance contract
        run: npm run test:wan-performance

      - name: Test Wan startup diagnostics contract
        run: npm run test:wan-startup-diagnostics

      - name: Test PT-BR narration and caption contracts
        run: npm run test:video-studio

      - name: Test offline PT-BR TTS native contract
        run: npm run test:video-studio-native

      - name: Test dubbed MP4 export native contract
        run: npm run test:video-studio-export

      - name: Test persistent storage and TTS cleanup contract
        run: npm run test:video-studio-storage

      - name: Test post-process pipeline contract
        run: npm run test:video-studio-pipeline

      - name: Test post-process cancellation contract
        run: npm run test:video-studio-cancel

      - name: Test PT-BR dubbing UI contract
        run: npm run test:video-studio-ui

      - name: Test full PT-BR UI localization contract
        run: npm run test:ptbr-ui

      - name: Test PT-BR chat runtime contract
        run: node scripts/test-chat-ptbr-contract.mjs

      - name: Typecheck localized sources
        run: npm run typecheck

      - name: Commit verified runtime updates
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- app components lib modules/saient-diffusion; then
            echo "No verified runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib modules/saient-diffusion
          git commit -m "fix: apply verified runtime updates"
          git push origin HEAD:feat/ptbr-video-studio
