# Triggered after deterministic runtime materialization to verify the corrected Kotlin source.
name: Video Studio Final Gates

on:
  push:
    branches:
      - feat/ptbr-video-studio
    paths:
      - 'app/(tabs)/video.tsx'
      - 'lib/wan-fast/**'
      - 'modules/saient-diffusion/**'
      - 'modules/saient-video-studio/**'
      - 'engine/arm64-v8a/**'
      - 'engine/wan/**'
      - 'plugins/quartz/**'
      - 'plugins/withTextToSpeechQueries.js'
      - 'scripts/build-wan-android.sh'
      - 'scripts/test-wan-fast-*.mjs'
      - 'scripts/test-wan-*.mjs'
      - 'scripts/test-video-studio*.mjs'
      - 'scripts/test-ptbr-ui-contract.mjs'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/video-studio-final-gates.yml'
  workflow_dispatch:

jobs:
  functional:
    name: Functional + TypeScript + Wan Fast
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Wan Fast policy
        run: npm run test:wan-fast-policy

      - name: Wan Fast build/package contract
        run: npm run test:wan-fast-build

      - name: Wan Fast native lifecycle
        run: npm run test:wan-fast-native

      - name: Wan Fast generation
        run: npm run test:wan-fast-generation

      - name: Wan Fast fallback
        run: npm run test:wan-fast-fallback

      - name: Wan Fast UI
        run: npm run test:wan-fast-ui

      - name: Existing Wan contract
        run: npm run test:wan

      - name: Wan performance contract
        run: npm run test:wan-performance

      - name: Wan startup diagnostics
        run: npm run test:wan-startup-diagnostics

      - name: Narration and caption contracts
        run: npm run test:video-studio

      - name: Offline PT-BR TTS contract
        run: npm run test:video-studio-native

      - name: Dubbed MP4 export contract
        run: npm run test:video-studio-export

      - name: Persistent storage contract
        run: npm run test:video-studio-storage

      - name: Post-process pipeline contract
        run: npm run test:video-studio-pipeline

      - name: Cancellation contract
        run: npm run test:video-studio-cancel

      - name: PT-BR dubbing UI contract
        run: npm run test:video-studio-ui

      - name: Full PT-BR interface contract
        run: npm run test:ptbr-ui

      - name: TypeScript
        run: npm run typecheck

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies at critical severity
        run: npm audit --omit=dev --audit-level=critical

  android:
    name: Full Android compile + engine packaging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Verify generated engine payloads
        run: |
          set -Eeuo pipefail
          test -s engine/arm64-v8a/libquartz.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libquartz.so
          cmp engine/arm64-v8a/libquartz.so android/app/src/main/jniLibs/arm64-v8a/libquartz.so

          test -s engine/arm64-v8a/libquartz-wan.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libquartz-wan.so
          cmp engine/arm64-v8a/libquartz-wan.so android/app/src/main/jniLibs/arm64-v8a/libquartz-wan.so

          test -s engine/arm64-v8a/libquartz-wan-fast.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libquartz-wan-fast.so
          cmp engine/arm64-v8a/libquartz-wan-fast.so android/app/src/main/jniLibs/arm64-v8a/libquartz-wan-fast.so

          file android/app/src/main/jniLibs/arm64-v8a/libquartz.so
          file android/app/src/main/jniLibs/arm64-v8a/libquartz-wan.so
          file android/app/src/main/jniLibs/arm64-v8a/libquartz-wan-fast.so
          sha256sum android/app/src/main/jniLibs/arm64-v8a/libquartz.so \
            android/app/src/main/jniLibs/arm64-v8a/libquartz-wan.so \
            android/app/src/main/jniLibs/arm64-v8a/libquartz-wan-fast.so

      - name: Compile release Kotlin
        working-directory: android
        env:
          SAIENT_ALLOW_DEBUG_RELEASE: 'true'
        run: ./gradlew :app:compileReleaseKotlin --stacktrace --no-daemon
