name: Video Studio Typecheck

on:
  push:
    branches:
      - feat/ptbr-video-studio
    paths:
      - 'app/(tabs)/video.tsx'
      - 'lib/video-studio/**'
      - 'modules/saient-video-studio/**/*.ts'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/video-studio-typecheck.yml'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run typecheck
